<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rootly - Hair Growth Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      background: #F5ECD9;
      cursor: none;
    }

    /* Background */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #F2DEC8;
      overflow: hidden;
    }

    .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.7; }
    .orb-1 { width: 700px; height: 700px; background: radial-gradient(circle, #E8A888, #F2DEC800); top: -200px; left: -150px; animation: drift1 22s ease-in-out infinite; }
    .orb-2 { width: 600px; height: 600px; background: radial-gradient(circle, #C9897A, #F2DEC800); bottom: -150px; right: -150px; animation: drift2 26s ease-in-out infinite; }
    .orb-3 { width: 500px; height: 500px; background: radial-gradient(circle, #D4A574, #F2DEC800); top: 30%; left: 40%; animation: drift3 18s ease-in-out infinite; }
    .orb-4 { width: 400px; height: 400px; background: radial-gradient(circle, #B8C4A8, #F2DEC800); top: 10%; right: 5%; animation: drift4 30s ease-in-out infinite; }
    .orb-5 { width: 350px; height: 350px; background: radial-gradient(circle, #D9B89A, #F2DEC800); bottom: 15%; left: 5%; animation: drift5 24s ease-in-out infinite; }

    @keyframes drift1 { 0% { transform: translate(0,0) scale(1); } 33% { transform: translate(120px,80px) scale(1.08); } 66% { transform: translate(60px,160px) scale(0.96); } 100% { transform: translate(0,0) scale(1); } }
    @keyframes drift2 { 0% { transform: translate(0,0) scale(1); } 33% { transform: translate(-100px,-60px) scale(1.06); } 66% { transform: translate(-40px,-130px) scale(1.1); } 100% { transform: translate(0,0) scale(1); } }
    @keyframes drift3 { 0% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.2) rotate(20deg); } 100% { transform: translate(-50%,-50%) scale(1); } }
    @keyframes drift4 { 0% { transform: translate(0,0); } 25% { transform: translate(-60px,40px); } 75% { transform: translate(40px,-60px); } 100% { transform: translate(0,0); } }
    @keyframes drift5 { 0% { transform: translate(0,0) scale(1); } 40% { transform: translate(70px,-50px) scale(1.05); } 80% { transform: translate(-40px,30px) scale(0.95); } 100% { transform: translate(0,0) scale(1); } }

    /* Mouse orb */
    .mouse-orb {
      position: fixed;
      width: 420px; height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,137,122,0.3), rgba(212,165,116,0.15), transparent 70%);
      pointer-events: none;
      z-index: 1;
      transform: translate(-50%,-50%);
      filter: blur(50px);
      transition: left 0.1s ease-out, top 0.1s ease-out;
    }

    .cursor {
      position: fixed;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #C9897A;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%,-50%);
      transition: left 0.03s, top 0.03s;
      box-shadow: 0 0 10px rgba(201,137,122,0.6);
    }

    /* Page layout */
    .page-wrap {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Center content */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      padding: 0 24px;
      animation: fadeUp 1.2s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand {
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(44,31,26,0.6);
      margin-bottom: 4px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(38px, 6vw, 72px);
      font-weight: 400;
      color: #2C1F1A;
      line-height: 1.15;
      letter-spacing: -0.01em;
      max-width: 700px;
    }

    .tagline {
      font-size: 16px;
      color: rgba(44,31,26,0.55);
      letter-spacing: 0.04em;
      margin-top: -4px;
    }

    /* CTA Button */
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 16px 32px;
      background: rgba(255,248,238,0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(201,137,122,0.3);
      border-radius: 100px;
      font-family: 'Jost', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: #2C1F1A;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
      box-shadow: 0 4px 24px rgba(160,100,60,0.12);
    }

    .cta:hover {
      background: rgba(255,248,238,0.7);
      border-color: rgba(201,137,122,0.6);
      transform: translateY(-2px);
    }

    .cta svg { width: 18px; height: 18px; fill: #2C1F1A; }

    /* Footer */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 24px;
    }

    .social-icons {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .social-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,248,238,0.35);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(201,137,122,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .social-icon svg { width: 16px; height: 16px; fill: rgba(44,31,26,0.6); }

    .footer-links {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .footer-links a {
      font-size: 12px;
      color: rgba(44,31,26,0.5);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }

    .footer-links a:hover { color: #C9897A; }

    .footer-links span {
      font-size: 12px;
      color: rgba(44,31,26,0.3);
    }

    .copyright {
      font-size: 11px;
      color: rgba(44,31,26,0.35);
      letter-spacing: 0.04em;
    }

    @media (max-width: 600px) {
      h1 { font-size: 36px; }
      .cta { padding: 14px 26px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>
  </div>

  <div class="mouse-orb" id="mouseOrb"></div>
  <div class="cursor" id="cursor"></div>

  <div class="page-wrap">
    <div class="hero">
      <p class="brand">Rootly</p>
      <h1>Your hair growth journey starts here.</h1>
      <p class="tagline">Track, log, and grow with your personal hair companion.</p>
      <a class="cta">
        <svg viewBox="0 0 814 1000" xmlns="http://www.w3.org/2000/svg"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 790.7 0 663 0 541.8c0-207.5 135.4-317.3 269-317.3 70.1 0 128.4 46.3 172.5 46.3 43.1 0 110.9-49 192.5-49 30.9 0 112.3 2.6 168.2 98.3zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/></svg>
        Download on the App Store
      </a>
    </div>
  </div>

  <footer>
    <div class="social-icons">
      <!-- Instagram -->
      <div class="social-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </div>
      <!-- Twitter / X -->
      <div class="social-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.748l7.73-8.835L1.254 2.25H8.08l4.259 5.629L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </div>
    </div>

    <p class="copyright">&copy; 2026 Rootly. All rights reserved.</p>

    <div class="footer-links">
      <a href="/privacy">Privacy Policy</a>
      <span>&bull;</span>
      <a href="/terms">Terms of Service</a>
      <span>&bull;</span>
      <a href="/support">Support</a>
    </div>
  </footer>

  <script>
    const mouseOrb = document.getElementById('mouseOrb');
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => {
      mouseOrb.style.left = e.clientX + 'px';
      mouseOrb.style.top = e.clientY + 'px';
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
  </script>

</body>
</html>
